services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app
    command: python3 backend/demo_server.py
    env_file:
      - .env
    environment:
      DEMO_PORT: "${DEMO_PORT:-8000}"
      LLM_API_KEY: "${LLM_API_KEY:-demo-only}"
      LLM_URL: "${LLM_URL:-https://ai-api-gateway.app.baizhi.cloud/api/openai/chat/completions}"
      LLM_MODEL: "${LLM_MODEL:-deepseek-flash}"
      AUTO_LLM_JUDGE: "${AUTO_LLM_JUDGE:-true}"
      AUTO_COUNTERMEASURE: "${AUTO_COUNTERMEASURE:-true}"
      AUTO_JUDGE_IDLE_SECONDS: "${AUTO_JUDGE_IDLE_SECONDS:-10}"
      ATTACK_TIMEOUT_SECONDS: "${ATTACK_TIMEOUT_SECONDS:-60}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,ssh-honeypot,host.docker.internal}"
      HONEYPOT_EVENTS_PATH: /data/honeypot/events.jsonl
      DEMO_STATE_PATH: /data/honeypot/state.json
      DEMO_INJECTION_POLICY_PATH: /data/honeypot/injections.json
    volumes:
      - .:/app
      - honeypot_data:/data/honeypot
    ports:
      - "${DEMO_PORT:-8000}:${DEMO_PORT:-8000}"
    depends_on:
      - ssh-honeypot
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ssh-honeypot:
    build:
      context: .
      dockerfile: honeypot/Dockerfile
    environment:
      HONEYPOT_USERNAME: "${HONEYPOT_USERNAME:-root}"
      HONEYPOT_PASSWORD: "${HONEYPOT_PASSWORD:-admin123456}"
      AUTO_COUNTERMEASURE: "${AUTO_COUNTERMEASURE:-true}"
      HONEYPOT_INJECTION_PATH: /data/honeypot/injections.json
    ports:
      - "${HONEYPOT_PORT:-2222}:22"
    volumes:
      - honeypot_data:/app/data
      - honeypot_data:/data/honeypot

  ai-attacker:
    build:
      context: .
      dockerfile: tools/Dockerfile
    environment:
      HONEYPOT_HOST: ssh-honeypot
      ATTACK_KIND: ai
      ATTACK_PROFILE_ID: "${ATTACK_PROFILE_ID:-}"
    depends_on:
      - ssh-honeypot
    profiles:
      - demo
    pull_policy: build
    restart: "no"

  human-attacker:
    build:
      context: .
      dockerfile: tools/Dockerfile
    entrypoint: ["python3", "/app/human_attacker.py"]
    environment:
      HONEYPOT_HOST: ssh-honeypot
      ATTACK_KIND: human
      ATTACK_PROFILE_ID: "${ATTACK_PROFILE_ID:-}"
    depends_on:
      - ssh-honeypot
    profiles:
      - demo
    pull_policy: build
    restart: "no"

  cm-attacker:
    build:
      context: .
      dockerfile: tools/Dockerfile
    entrypoint: ["python3", "/app/countermeasure_attacker.py"]
    environment:
      HONEYPOT_HOST: ssh-honeypot
      COUNTERMEASURE_ID: "${COUNTERMEASURE_ID:-}"
      COUNTERMEASURE_BEACON: "${COUNTERMEASURE_BEACON:-}"
    depends_on:
      - ssh-honeypot
    profiles:
      - demo
    pull_policy: build
    restart: "no"

  realistic-ai-attacker:
    build:
      context: .
      dockerfile: tools/Dockerfile
    entrypoint: ["python3", "/app/realistic_ai_attacker.py"]
    environment:
      HONEYPOT_HOST: ssh-honeypot
    depends_on:
      - ssh-honeypot
    profiles:
      - demo
    pull_policy: build
    restart: "no"

volumes:
  honeypot_data:
